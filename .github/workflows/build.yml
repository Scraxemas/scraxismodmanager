name: Build and test SwagMod
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/SwagMod.UnitTests/SwagMod.UnitTests.csproj --configuration Release
      - name: Publish Windows desktop
        run: dotnet publish src/SwagMod.Desktop/SwagMod.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/SwagMod-win-x64
      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path artifacts/SwagMod-win-x64/* -DestinationPath artifacts/SwagMod-win-x64.zip
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SwagMod-win-x64
          path: artifacts/SwagMod-win-x64.zip
